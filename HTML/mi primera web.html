<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlix</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

/* NAVBAR */

header{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    background:linear-gradient(to bottom,#000,transparent);
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#e50914;
    font-size:2rem;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:.3s;
}

nav a:hover{
    color:#e50914;
}

/* HERO */

.hero{
    height:100vh;
    background:
    linear-gradient(to right,
    rgba(0,0,0,.9),
    rgba(0,0,0,.4)),
    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    padding:0 80px;
}

.hero-content{
    max-width:600px;
    animation:fadeIn 1.2s ease;
}

.hero h1{
    font-size:4rem;
    margin-bottom:20px;
}

.hero p{
    font-size:1.1rem;
    line-height:1.6;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:15px;
}

.btn{
    padding:15px 30px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:1rem;
    font-weight:bold;
    transition:.3s;
}

.play{
    background:white;
}

.info{
    background:rgba(109,109,110,.7);
    color:white;
}

.btn:hover{
    transform:scale(1.05);
}

/* SECCIONES */

.section{
    padding:30px 50px;
}

.section h2{
    margin-bottom:20px;
}

/* GRID */

.movies{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:10px;
    cursor:pointer;
    transition:.4s;
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}

.card:hover{
    transform:scale(1.08);
    z-index:5;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(transparent,black);
    display:flex;
    align-items:flex-end;
    padding:15px;
    opacity:0;
    transition:.4s;
}

.card:hover .overlay{
    opacity:1;
}

/* ANIMACIÓN */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
}

</style>
</head>
<body>

<header>
    <div class="logo">CINEFLIX</div>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Series</a>
        <a href="#">Películas</a>
        <a href="#">Mi Lista</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>El Reino Oscuro</h1>

        <p>
            Una aventura épica llena de acción,
            misterio y criaturas legendarias.
        </p>

        <div class="buttons">
            <button class="btn play">▶ Reproducir</button>
            <button class="btn info">ℹ Más información</button>
        </div>
    </div>
</section>

<section class="section">
    <h2>Tendencias</h2>

    <div class="movies">

        <div class="card">
            <img src="https://picsum.photos/400/600?1">
            <div class="overlay"><h3>Película 1</h3></div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/600?2">

        </div>

        <div class="card">

        </div>

        </div>

        <div class="card">

        </div>

    </div>
</section>

<section class="section">
    <h2>Acción</h2>

    <div class="movies">

        <div class="card">
            <img src="https://picsum.photos/400/600?6">

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/600?7">

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/600?8">

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/600?9">

        </div>

        <div class="card">
            <img src="https://picsum.photos/400/600?10">
            <div class="overlay"><h3>Acción 5</h3></div>
        </div>

    </div>
</section>

<footer>
    © 2026 CineFlix
</footer>

</body>
</html>
