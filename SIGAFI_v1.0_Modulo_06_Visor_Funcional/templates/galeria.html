{% extends "base.html" %}

{% block contenido %}

<div class="container mt-4">

    <h2 class="mb-4">
        Galería Institucional
    </h2>

    <div class="row">

        {% for actividad in actividades %}

        <div class="col-md-4 mb-4">

            <div class="card shadow">
                {% if actividad.portada %}

            <img
                src="{{ url_for('foto.ver_foto', id=actividad.fotos[0].id) }}"
                class="card-img-top"
                style="height:220px; object-fit:cover;">

                {% endif %}

                <div class="card-body">

                    <h5>

                        {{ actividad.nombre }}

                    </h5>

                    <p>

                        {{ actividad.fecha.strftime("%d/%m/%Y") }}

                    </p>

                    <p>

                        {{ actividad.fotos|length }} fotografías

                    </p>

                    <a
                        href="{{ url_for('gallery.album', id=actividad.id) }}"
                        class="btn btn-primary">

                        Ver álbum

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
