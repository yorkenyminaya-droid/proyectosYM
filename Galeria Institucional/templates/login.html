<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - SIGAFI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/inicio.css') }}">

</head>

<body>

<div class="overlay">

    <div class="contenido">

        <img
            src="{{ url_for('static', filename='img/logo.png') }}"
            class="logo"
            alt="ISEEPENC">

        <h2 class="institucion">
            ISEEPENC
        </h2>

        <h3 class="text-white mb-4">
            Iniciar sesión
        </h3>

{% with mensajes = get_flashed_messages(with_categories=true) %}
{% if mensajes %}

    {% for categoria, mensaje in mensajes %}

        <div class="alert alert-{{ categoria }}">

            {{ mensaje }}

        </div>

    {% endfor %}

{% endif %}
{% endwith %}

        <form method="POST">

            <div class="mb-3">

                <input
    type="text"
    class="form-control"
    name="usuario"
    placeholder="Usuario"
    required>

            </div>

            <div class="mb-4">

                <input
    type="password"
    class="form-control"
    name="password"
    placeholder="Contraseña"
    required>

            </div>

            <button
                class="btn btn-iniciar w-100">

                Iniciar sesión

            </button>

        </form>

    </div>

</div>

</body>

</html>
